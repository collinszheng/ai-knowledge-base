# 把 docs/ 构建成静态站点并发布到 GitHub Pages
# 触发方式：推送到 main，或在仓库的 Actions 页面手动运行
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 官方要求的权限组合：读代码 + 写 Pages + 用 OIDC 拿部署凭据
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送排队等待，而不是打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 让 VitePress 能读到每个文件的 git 时间戳（页脚的「最后更新于」）
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run docs:build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
